<!DOCTYPE html>
<head>
    <meta http-equiv="Content-Security-Policy"
		content="
    	    script-src  'self' 'unsafe-eval' 'unsafe-inline' blob:;
    	    connect-src 'self' wss:;
		    img-src     'self' data: blob:;
    	    media-src   'self' data:;
    	    frame-src   'none';
	    ">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="TemplateData/Build.loader.js"></script>
    <script>
        var gameInstance = UnityLoader.instantiate("gameContainer", "Build/Build.json", { onProgress: UnityProgress, Module: { onRuntimeInitialized: function() { UnityProgress(gameInstance, "complete") } } });
    </script>
</head>
<body style="margin: 0; overflow: hidden;">
    <div class="webgl-content">
        <div id="gameContainer" style="width: 100%; height: 100%; margin: 0;"></div>
    </div>
</body>
</html>
